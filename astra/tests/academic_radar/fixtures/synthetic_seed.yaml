routes:
  - seed_key: "quantum-simulation-route"
    name: "Quantum Simulation and Error Correction"
    state: ACTIVE
    statement: "Investigate supervisor opportunities in quantum simulation, error correction codes, and scalable quantum computing architectures."
    core_problem: "Current quantum computers are limited by decoherence and error rates; developing robust error correction and simulation techniques is critical for practical quantum advantage."
    methods:
      - "Topological error correction"
      - "Variational quantum algorithms"
      - "Tensor network methods"
      - "Quantum circuit optimization"
    corpora:
      - "Recent quantum computing literature (arXiv, Nature, Science)"
      - "IEEE Quantum Engineering journal"
      - "Open-source quantum frameworks (Qiskit, Cirq, PennyLane)"
    target_disciplines:
      - "Quantum Physics"
      - "Computer Science (Quantum Computing)"
      - "Applied Mathematics"
      - "Physics (Computational)"
    prohibited_overclaims:
      - "Claims about near-term quantum advantage without explicit experimental backing"
      - "Proposed solutions claiming to solve all quantum error correction at once"
    maturity: EXPLORATORY

  - seed_key: "computational-physics-phd"
    name: "Computational Physics & Scientific Computing"
    state: ACTIVE
    statement: "Explore PhD opportunities in computational physics, scientific machine learning, and high-performance computing applied to physical simulations."
    core_problem: "Large-scale scientific simulations require new algorithmic approaches and computational methods to handle modern hardware (GPUs, distributed systems)."
    methods:
      - "GPU-accelerated numerical methods"
      - "Machine learning for physics simulation"
      - "High-performance distributed computing"
      - "Inverse problem solving"
    corpora:
      - "SIAM journals and proceedings"
      - "ML4Science venues (NeurIPS, ICML workshops)"
      - "Applied Mathematics literature"
      - "HPC conference proceedings"
    target_disciplines:
      - "Applied Physics"
      - "Computational Science"
      - "Computer Science (Scientific Computing)"
      - "Mathematics (Numerical Analysis)"
    prohibited_overclaims:
      - "Claims that machine learning replaces traditional numerical analysis without validation"
      - "Overstatement of scalability without demonstrated benchmarks"
    maturity: ACTIVE
