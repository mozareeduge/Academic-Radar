name: go

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

jobs:
  backend:
    name: Backend (self-test + pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            astra/requirements.txt
            astra/requirements-dev.txt
      - name: Install backend deps
        # requirements-dev.txt pulls in requirements.txt AND the test runner.
        # Installing only the runtime manifest is what made this job fail with
        # "No module named pytest" — the suite never ran at all.
        run: pip install -r astra/requirements-dev.txt
      - name: Offline CLI self-test
        run: cd astra && python3 astra.py --self-test
      - name: Backend tests
        run: cd astra && python3 -m pytest tests/ -q

  frontend:
    name: Dashboard (test + lint + typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npm test -- --runInBand
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build

  security:
    name: Dependency audits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: pip-audit
        run: |
          python3 -m venv /tmp/a && /tmp/a/bin/pip install -q pip-audit \
            && /tmp/a/bin/pip-audit -r astra/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
        working-directory: dashboard
      - name: npm audit
        working-directory: dashboard
        run: npm audit --audit-level=high

  compose-smoke:
    name: Docker Compose smoke test
    runs-on: ubuntu-latest
    needs: [backend, frontend]  # not `security`: the npm-audit job is red at the donor baseline and would skip this smoke test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Create ephemeral environment file (random secret, fixture mode)
        run: |
          {
            echo "ASTRA_SECRET_KEY=$(openssl rand -hex 32)"
            echo "RADAR_FIXTURE_MODE=1"
          } > .env
      - name: Start compose stack
        run: docker compose --profile redis up -d --build
      - name: Container logs (on failure)
        if: failure()
        run: docker compose --profile redis logs --no-color --tail 120 api radar-worker
      - name: Run smoke test
        run: python scripts/rc_smoke.py
        timeout-minutes: 5
      - name: Restart services
        if: always()
        run: docker compose --profile redis restart
      - name: Verify durable state
        if: always()
        run: python scripts/rc_smoke.py --verify-durable
        timeout-minutes: 2
      - name: Cleanup
        if: always()
        run: docker compose --profile redis down

  release-validate:
    name: Release candidate (SHA build, non-root, production overlay)
    runs-on: ubuntu-latest
    needs: [backend, frontend, security, compose-smoke]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Create ephemeral production configuration
        run: |
          {
            echo "ASTRA_SECRET_KEY=$(openssl rand -hex 32)"
            echo "CORS_ORIGINS=http://localhost:3000"
            echo "NEXT_PUBLIC_API_URL=http://localhost:8000"
            echo "RADAR_OWNER_EMAIL=owner@example.invalid"
            echo "RADAR_FIXTURE_MODE=0"
            echo "RADAR_IMAGE_TAG=${GITHUB_SHA}"
          } > .env
      - name: Validate rendered production dependencies and settings
        run: |
          docker compose --profile redis -f docker-compose.yml -f docker-compose.prod.yml config --format json > /tmp/radar-production-compose.json
          python scripts/check_release_compose.py /tmp/radar-production-compose.json "$GITHUB_SHA"
      - name: Build SHA-tagged candidate images
        run: docker compose --profile redis -f docker-compose.yml -f docker-compose.prod.yml build api radar-worker dashboard
        timeout-minutes: 20
      - name: Verify image runtime users
        run: |
          for service in api radar-worker dashboard; do
            uid=$(docker compose --profile redis -f docker-compose.yml -f docker-compose.prod.yml run --rm --no-deps --entrypoint id "$service" -u)
            test "$uid" -gt 0 || { echo "$service runs as root"; exit 1; }
            echo "$service runtime UID: $uid"
          done
      - name: Start production overlay and check live services
        run: |
          docker compose --profile redis -f docker-compose.yml -f docker-compose.prod.yml up -d redis api radar-worker dashboard
          curl --fail --retry 20 --retry-connrefused --retry-delay 3 http://localhost:8000/health
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/api/radar/dev/cases)" = 404
          worker_id=$(docker compose --profile redis -f docker-compose.yml -f docker-compose.prod.yml ps -q radar-worker)
          test -n "$worker_id"
          test "$(docker inspect --format '{{.State.Running}}' "$worker_id")" = true
        timeout-minutes: 5
      - name: Production overlay logs on failure
        if: failure()
        run: docker compose --profile redis -f docker-compose.yml -f docker-compose.prod.yml logs --no-color --tail 120 api radar-worker dashboard redis
      - name: Stop production overlay
        if: always()
        run: docker compose --profile redis -f docker-compose.yml -f docker-compose.prod.yml down
